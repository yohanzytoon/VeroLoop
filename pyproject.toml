[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalframe"
version = "0.1.0"
description = "Provider-neutral structured-output evaluation for AI systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "EvalFrame contributors" }]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "tenacity>=8.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
gemini = ["google-genai>=1.0"]
mlflow = ["mlflow>=2.15"]
providers = ["openai>=1.40", "anthropic>=0.34", "google-genai>=1.0"]
dev = [
  "build>=1.2", "hatchling>=1.25", "mypy>=1.11", "pre-commit>=3.8",
  "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
evalframe = "evalframe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evalframe"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=evalframe --cov-report=term-missing"

[tool.coverage.run]
branch = true
